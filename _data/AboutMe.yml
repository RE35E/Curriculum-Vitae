subject: About Me
listing-order: 1
icon: "/assets/img/user.svg"
contents:
  - title: Welcome!
    description:
      - "I'm a recent BSc Information Technology graduate from North-West University and have always had a passion for technology, which inspired me to pursue a career in software development. I'm enthusiastic about developing practical, scalable software solutions and continuously improving as a developer.

        Before IT, I completed a qualification in architecture, which gives me a unique perspective and approach that I can bring to software development.

        I'm actively exploring internship and junior developer opportunities where I can grow my skills and contribute to real-world projects. If you're looking for a motivated graduate with a multidisciplinary background and a strong passion for learning, please feel free to contact me."